<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Euron Open AI Chat</title>
  <desc id="d">Euron Open AI Chat: a self-hosted, ChatGPT-like assistant with any model, web search with citations, files, vision, images, projects and memory, on infrastructure you own.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F1B2D"/>
    </linearGradient>
    <linearGradient id="img" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="0.6" stop-color="#d9735b"/>
      <stop offset="1" stop-color="#f6c38a"/>
    </linearGradient>
    <clipPath id="r"><rect width="1280" height="360" rx="24"/></clipPath>
    <clipPath id="win"><rect x="0" y="0" width="470" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <g fill="none" stroke="#0E99AD" stroke-opacity="0.16" stroke-width="1.2">
      <circle cx="1190" cy="30" r="120"/>
      <circle cx="1190" cy="30" r="180"/>
      <circle cx="1190" cy="30" r="240"/>
      <circle cx="1190" cy="30" r="300"/>
    </g>

    <!-- Mark: a speech bubble with a spark -->
    <g transform="translate(72 70)">
      <rect width="56" height="56" rx="16" fill="#F4F7FB"/>
      <path d="M14 18.4A6.1 6.1 0 0 1 20.1 12.3h15.8A6.1 6.1 0 0 1 42 18.4v11.4a6.1 6.1 0 0 1-6.1 6.1h-9.1L19.3 42.4v-6.5A6.1 6.1 0 0 1 14 29.8z" fill="#0B1220"/>
      <path d="M28 16.8l1.85 4.1 4.1 1.85-4.1 1.85L28 28.7l-1.85-4.1-4.1-1.85 4.1-1.85z" fill="#11A3B8"/>
    </g>

    <text x="72" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.4" fill="#F4F7FB">Euron Open AI Chat</text>
    <text x="74" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#B7C3D3">A private AI assistant for your team: any model, web search</text>
    <text x="74" y="266" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#B7C3D3">with citations, files, vision, images, projects and memory.</text>
    <text x="74" y="312" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="1.6" fill="#11A3B8">OPEN SOURCE · SELF-HOSTED · BRING YOUR OWN MODELS</text>

    <!-- A chat window -->
    <g transform="translate(760 34) rotate(-2)">
      <rect x="-6" y="-6" width="482" height="312" rx="22" fill="#1F2A3D"/>
      <g clip-path="url(#win)">
        <rect width="470" height="300" fill="#F5F7FA"/>
        <rect width="470" height="34" fill="#FFFFFF"/>
        <rect x="16" y="13" width="64" height="8" rx="4" fill="#0B1220" fill-opacity="0.8"/>
        <rect x="88" y="15" width="8" height="4" rx="2" fill="#94A3B8"/>
        <!-- question -->
        <rect x="236" y="48" width="218" height="30" rx="15" fill="#E7ECF2"/>
        <rect x="252" y="59" width="150" height="8" rx="4" fill="#334155" fill-opacity="0.75"/>
        <!-- tool step -->
        <circle cx="24" cy="98" r="5" fill="none" stroke="#0E99AD" stroke-width="1.6"/>
        <rect x="36" y="94" width="150" height="7" rx="3.5" fill="#94A3B8"/>
        <!-- answer lines with citation marks -->
        <rect x="16" y="116" width="300" height="8" rx="4" fill="#0B1220" fill-opacity="0.78"/>
        <rect x="322" y="114" width="6" height="6" rx="1" fill="#0E99AD"/>
        <rect x="16" y="132" width="268" height="8" rx="4" fill="#0B1220" fill-opacity="0.78"/>
        <rect x="16" y="148" width="286" height="8" rx="4" fill="#0B1220" fill-opacity="0.78"/>
        <rect x="308" y="146" width="6" height="6" rx="1" fill="#0E99AD"/>
        <!-- code block -->
        <rect x="16" y="166" width="300" height="56" rx="8" fill="#E7ECF2"/>
        <rect x="28" y="178" width="56" height="6" rx="3" fill="#7C3AED" fill-opacity="0.8"/>
        <rect x="90" y="178" width="96" height="6" rx="3" fill="#2563EB" fill-opacity="0.8"/>
        <rect x="40" y="192" width="120" height="6" rx="3" fill="#0F766E" fill-opacity="0.8"/>
        <rect x="28" y="206" width="30" height="6" rx="3" fill="#475569" fill-opacity="0.8"/>
        <!-- generated image -->
        <rect x="330" y="116" width="124" height="106" rx="10" fill="url(#img)"/>
        <polygon points="383,140 389,140 393,196 379,196" fill="#F3EFE6"/>
        <rect x="330" y="198" width="124" height="24" fill="#1E3A5F"/>
        <!-- composer -->
        <rect x="16" y="244" width="438" height="42" rx="21" fill="#FFFFFF" stroke="#CBD5E1"/>
        <rect x="34" y="262" width="120" height="7" rx="3.5" fill="#94A3B8"/>
        <circle cx="434" cy="265" r="12" fill="#0B1220"/>
        <path d="M434 270v-9m-4 4l4-4 4 4" fill="none" stroke="#F4F7FB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
