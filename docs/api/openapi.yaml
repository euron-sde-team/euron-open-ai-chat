openapi: 3.1.0
info:
  title: Euron Open AI Chat API
  version: 0.1.0
  description: |
    REST API of Euron Open AI Chat. Sign in with POST /api/auth/login to get a short-lived access
    token (send it as `Authorization: Bearer <token>`) and an httpOnly refresh cookie that
    POST /api/auth/refresh rotates. Native apps send `X-Client: native` and get the refresh token
    in the body instead. Answers stream as Server-Sent Events from POST /api/chats/:id/messages
    (Accept: text/event-stream) or GET /api/turns/:id/events, resumable with ?after=<seq>
    (docs/api/streaming.md). The typed DTOs and the event catalogue are in packages/types.
    Errors are `{ "error": string, "code": string, "details"?: unknown, "requestId": string }`;
    unexpected failures return 500 with a `requestId` and never the underlying message.
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:3540
    description: Local stack (make up), through the web app's proxy
  - url: https://{host}
    variables: { host: { default: app.example.com } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: "Access token from POST /api/auth/login or /api/auth/refresh." }
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string }, code: { type: string }, requestId: { type: string } }
tags:
  - name: "auth"
    description: "sign-up, sign-in, sessions, email verification, password reset and two-factor. With `X-Client: native` every session is `IssuedNativeSession` (the refresh token in the body, never a cookie) and refresh / logout take `{ refreshToken }` in the body. New passwords are 10 to 128 characters (400 VALIDATION_FAILED naming the field)."
  - name: "users"
    description: "your account, sessions, export and deletion."
  - name: "meta"
    description: "public facts a client reads before anyone signs in."
  - name: "models"
    description: "the model picker."
  - name: "me"
    description: "your usage and preferences."
  - name: "files"
    description: "direct-to-storage uploads, your files, and the local-storage stand-in for presigned URLs."
  - name: "chats"
    description: "conversations and sending messages. A send starts a turn on the server; with `Accept: text/event-stream` the same response streams its events (docs/api/streaming.md), otherwise it answers 202 `TurnStarted` and the client follows GET /api/turns/:id/events."
  - name: "messages"
    description: "actions on one message."
  - name: "turns"
    description: "following and stopping an answer while the server writes it."
  - name: "memories"
    description: "what the assistant remembers about you. You can see, edit and delete every memory."
  - name: "projects"
    description: "chats grouped under shared instructions and knowledge files."
  - name: "images"
    description: "the image studio and your gallery."
  - name: "shares"
    description: "public links to a frozen copy of a chat."
  - name: "shared"
    description: "the public side of a shared link. No account needed."
  - name: "speech"
    description: "dictation. Read aloud is GET /api/messages/:id/speech."
  - name: "admin"
    description: "the control plane. Admins only (403 FORBIDDEN_ADMIN otherwise). Admins see accounts, usage and configuration, never anyone's conversations."
