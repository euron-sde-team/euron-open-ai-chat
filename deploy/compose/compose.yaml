# ─────────────────────────────────────────────────────────────────────────────
# Euron Open AI Chat: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# On its own the base keeps media on a volume (STORAGE=local) and sends mail straight
# to Mailpit (MAIL_MODE=smtp); the overlays switch both to S3 and SES.
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways. `make up-aws`
# also reads deploy/compose/.env.aws, whose values win over the defaults here.
#
# Host ports (override in .env, or in your shell, if they clash with something else):
#   web 3540   api 5036   postgres 5502   redis 6439   mailpit 8056 (smtp 1056)
#   floci 4607   stubs 5129   searxng 8089
#
# The browser only ever talks to the web app: it proxies /api/* to the API
# (API_INTERNAL_URL), so the refresh cookie is first-party, exactly as behind the load
# balancer on AWS. The API port is published for curl and the integration tools.
#
# Model providers: the stack needs no key at all. `make demo` registers the "Stub"
# provider (apps/stubs: deterministic OpenAI-compatible, Anthropic and Gemini
# stand-ins, plus images, speech, moderation and search) next to the real ones; put
# PROVIDER_KEYS or OPENAI_API_KEY, ANTHROPIC_API_KEY, ... in .env to chat with real
# models.
#
# Web search runs on the bundled SearXNG (self-hosted metasearch, no key, port 8089).
# For deterministic results set SEARCH_PROVIDER=stub in .env (the integration tests
# and the e2e suite do): the stub search answers from apps/stubs and its pages are
# readable by open_url because FETCH_ALLOW_HOSTS lists the stubs host.
# ─────────────────────────────────────────────────────────────────────────────
name: open-chat

# Every value an overlay or an env file may want to change is a ${NAME:-default}
# interpolation under the variable's own name, so `--env-file .env.aws` (make up-aws)
# and your shell can set it; the overlays then set their own values on top. Precedence,
# highest first: an overlay's `environment:`, your shell, the last --env-file
# (.env.aws for up-aws, then .env), the default below. Keys the base does not set at
# all (S3_BUCKET, MEDIA_ORIGINS, ...) also reach the containers through the overlay's
# `env_file:`.
x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  NODE_ENV: development
  TZ: UTC
  PORT: "5036"
  LOG_LEVEL: ${LOG_LEVEL:-${CHAT_LOG_LEVEL:-info}}
  PRODUCT_NAME: ${PRODUCT_NAME:-${CHAT_PRODUCT_NAME:-Euron Open AI Chat}}
  APP_WEB_URL: http://localhost:${CHAT_WEB_PORT:-3540}
  # Same origin as the web app: the browser reaches the API through the web proxy.
  PUBLIC_API_URL: http://localhost:${CHAT_WEB_PORT:-3540}
  CORS_ORIGINS: http://localhost:${CHAT_WEB_PORT:-3540}
  TRUST_PROXY: "1"
  DATABASE_URL: postgres://chat:chat@postgres:5432/chat
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  # Migrations run once, in the `migrate` one-shot, before the API and worker start.
  MIGRATE_ON_BOOT: "false"
  REDIS_URL: redis://redis:6379
  JOBS_MODE: queue
  JWT_SECRET: ${CHAT_JWT_SECRET:?run `make env` first}
  REFRESH_SECRET: ${CHAT_REFRESH_SECRET:?run `make env` first}
  # 32 random bytes, base64: encrypts stored TOTP secrets. `make env` adds it to an
  # existing .env as well.
  TOTP_ENCRYPTION_KEY: ${CHAT_TOTP_ENCRYPTION_KEY:?run `make env` first}
  COOKIE_SECURE: "false"
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  STORAGE: ${STORAGE:-local}
  DATA_DIR: /app/data
  MAIL_MODE: ${MAIL_MODE:-smtp}
  MAIL_FROM: ${MAIL_FROM:-${CHAT_PRODUCT_NAME:-Euron Open AI Chat} <no-reply@chat.example.test>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  # Model provider keys (all optional; empty values are ignored). PROVIDER_KEYS is a
  # JSON object keyed by provider slug, e.g. {"openai":"sk-...","anthropic":"sk-ant-..."},
  # and wins over the single-key shortcuts below.
  PROVIDER_KEYS: ${PROVIDER_KEYS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  # Where providers of kind STUB (the demo's "Stub" provider) live.
  STUBS_URL: ${STUBS_URL:-http://stubs:5129}
  # web_search: searxng (bundled, below), stub, tavily, exa, brave or none.
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-searxng}
  SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  EXA_API_KEY: ${EXA_API_KEY:-}
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  # Prompt moderation: none, stub (flags input containing STUB_FLAG) or openai.
  MODERATION_PROVIDER: ${MODERATION_PROVIDER:-none}
  # open_url refuses private addresses; the stubs host is the one local exception, so
  # the stub search results can be opened. Never set this on a real deployment.
  FETCH_ALLOW_HOSTS: ${FETCH_ALLOW_HOSTS:-stubs}

# api, worker and migrate are one image with three commands. Each carries the same build
# so any of them can be started alone; BuildKit builds it once and reuses the cache.
x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "127.0.0.1:${CHAT_PG_PORT:-5502}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 3s
      timeout: 3s
      retries: 30

  # BullMQ (turns, file extraction, upkeep) and rate limits. A plain container in
  # every local setup; ElastiCache (infra/terraform/modules/cache) on AWS.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${CHAT_REDIS_PORT:-6439}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Every mail the stack sends lands here (directly with MAIL_MODE=smtp, or relayed by
  # the emulator's SES with MAIL_MODE=ses). Web UI: http://localhost:8056
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "127.0.0.1:${CHAT_MAILPIT_PORT:-8056}:8025"
      # SMTP, for MAIL_MODE=smtp (the integration matrix sends straight to it).
      - "127.0.0.1:${CHAT_SMTP_PORT:-1056}:1025"

  # Deterministic stand-ins for the model providers, image generation, speech,
  # moderation and web search (apps/stubs). GET http://localhost:5129/__/requests lists
  # what the API sent it.
  stubs:
    build:
      context: ../..
      dockerfile: infra/docker/stubs.Dockerfile
    image: open-chat-stubs:local
    environment:
      PORT: "5129"
      # The stub search links its results to the stub's own pages; open_url fetches them
      # from the API container, so they use the compose host name (FETCH_ALLOW_HOSTS).
      STUB_PUBLIC_URL: http://stubs:5129
    ports:
      - "127.0.0.1:${CHAT_STUB_PORT:-5129}:5129"
    restart: unless-stopped

  # SearXNG: self-hosted metasearch for the web_search tool (SEARCH_PROVIDER=searxng).
  # deploy/compose/searxng/settings.yml enables the JSON API; the secret key comes from
  # .env (make env). It queries public search engines from your machine, so results
  # vary; SEARCH_PROVIDER=stub is the deterministic alternative.
  searxng:
    image: searxng/searxng:2026.9.30-a9d990033
    environment:
      SEARXNG_SECRET: ${CHAT_SEARXNG_SECRET:?run `make env` first}
      SEARXNG_BASE_URL: http://localhost:${CHAT_SEARXNG_PORT:-8089}/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${CHAT_SEARXNG_PORT:-8089}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: apply db/migrations, then exit 0. The API and worker wait for it.
  migrate:
    build: *api-build
    image: open-chat-api:local
    command: ["node", "--enable-source-maps", "dist/migrate.js"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: open-chat-api:local
    # A model server on the host (Ollama, LM Studio) answers at http://host.docker.internal:<port>, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "--enable-source-maps", "dist/index.js"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${CHAT_API_PORT:-5036}:5036"
    volumes:
      - mediadata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      stubs:
        condition: service_started
      searxng:
        condition: service_started
    restart: unless-stopped

  worker:
    build: *api-build
    image: open-chat-api:local
    # A model server on the host (Ollama, LM Studio) answers at http://host.docker.internal:<port>, on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment:
      <<: *api-env
    volumes:
      - mediadata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000
    # No HTTP port: the image's /up check does not apply.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:5036
    image: open-chat-web:local
    environment:
      # Server side only: where the Next server proxies /api/* (streamed chat turns
      # included: the API marks them no-transform and X-Accel-Buffering: no).
      API_INTERNAL_URL: http://api:5036
      PRODUCT_NAME: ${PRODUCT_NAME:-${CHAT_PRODUCT_NAME:-Euron Open AI Chat}}
    ports:
      - "127.0.0.1:${CHAT_WEB_PORT:-3540}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mediadata:
